name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.10
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --no-editable --group build
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test negative and positive paths
        run: |
          uv run coverage run -m unittest discover -s tests -v
          uv run coverage report --fail-under=90
      - name: Audit locked Python dependencies
        run: |
          uv run pip-audit --requirement requirements.lock --disable-pip
          uv run pip-audit --requirement build-requirements.lock --disable-pip
      - name: Compile package
        run: uv run python -m compileall -q src
      - name: Build and smoke-test the wheel
        run: |
          uv build --no-build-isolation --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.11.16
          uv pip install \
            --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            --require-hashes \
            --requirement requirements.lock
          uv pip install \
            --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            --no-deps \
            "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/mergegrounds-verifier" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import json
          from importlib.resources import files
          from jsonschema import Draft202012Validator

          schemas = sorted(files("mergegrounds_verifier.schemas").glob("*.json"))
          assert len(schemas) == 5, schemas
          for path in schemas:
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
          PY

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build digest-pinned image
        run: docker build --tag mergegrounds-verifier:test .
      - name: Smoke test non-root image
        run: |
          test "$(docker run --rm --entrypoint=id mergegrounds-verifier:test -u)" = "65532"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges mergegrounds-verifier:test --version
