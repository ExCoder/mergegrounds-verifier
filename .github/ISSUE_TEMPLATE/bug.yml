name: Bug report
description: Report reproducible verifier behavior that is not a private vulnerability.
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private source, keys, raw findings, or exploit details. Use private security reporting for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal redacted reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fail-closed behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
